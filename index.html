<title>Epistera — Founders First Principles</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    background: #fafaf7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .gate {
    width: 100%;
    max-width: 380px;
    padding: 48px 40px;
    background: #fff;
    border-radius: 6px;
    box-shadow: 0 2px 24px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.06);
    text-align: center;
  }
  .wordmark {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #1d4e89;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }
  .sub {
    font-size: 13px;
    color: #777;
    margin-bottom: 32px;
    line-height: 1.5;
  }
  .field {
    position: relative;
    margin-bottom: 14px;
  }
  input[type=password] {
    width: 100%;
    padding: 12px 16px;
    font-size: 15px;
    border: 1.5px solid #ddd;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.15s;
    background: #fff;
    color: #1a1a1a;
    letter-spacing: 0.08em;
  }
  input[type=password]:focus { border-color: #1d4e89; }
  input[type=password].error { border-color: #c0392b; }
  button {
    width: 100%;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    background: #1d4e89;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  button:hover { background: #174077; }
  button:disabled { opacity: 0.6; cursor: default; }
  .err {
    font-size: 13px;
    color: #c0392b;
    margin-top: 12px;
    min-height: 18px;
  }
</style>
</head>

</div>

function hex(s) {
  const b = new Uint8Array(s.length / 2);
  for (let i = 0; i < b.length; i++) b[i] = parseInt(s.slice(i*2, i*2+2), 16);
  return b;
}
function b64(s) {
  const bin = atob(s);
  const b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  return b;
}

async function unlock() {
  const pw = document.getElementById('pw').value;
  if (!pw) return;
  const btn = document.getElementById('btn');
  const errEl = document.getElementById('err');
  const pwEl = document.getElementById('pw');
  btn.disabled = true;
  btn.textContent = 'Decrypting...';
  errEl.textContent = '';
  pwEl.classList.remove('error');

  try {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: hex(SALT), iterations: 100000, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );

    const cipherData = b64(DATA);
    const tagBytes   = hex(TAG);
    const combined   = new Uint8Array(cipherData.length + tagBytes.length);
    combined.set(cipherData);
    combined.set(tagBytes, cipherData.length);

    const decrypted = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: hex(IV), tagLength: 128 },
      key,
      combined
    );

    const html = new TextDecoder().decode(decrypted);
    document.open();
    document.write(html);
    document.close();
  } catch(e) {
    pwEl.classList.add('error');
    errEl.textContent = 'Wrong password.';
    btn.disabled = false;
    btn.textContent = 'Enter';
    pwEl.value = '';
    pwEl.focus();
  }
}

document.getElementById('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') unlock();
});
